<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yafri Manager Interface</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <div class="circle"></div>
            <h1>Yafri FM</h1>
        </div>
        <div class="role">MANAGER</div>
        <button class="user-button">User ▼</button>
    </header>

    <div class="container">
        <nav class="sidebar">
            <button class="toggle-btn">☰</button>
            <ul id="barcontent">
                <li><a href="welcome.html"><button class="nav-btn">Welcome</button></a></li>
                <li><a href="calendar.html"><button class="nav-btn">Calendar</button></a></li>
                <li><a href="songs_report.html"><button class="nav-btnN">Songs Report</button></a></li>
                <li><a href="djs.html"><button class="nav-btn">DJs</button></a></li>
            </ul>
        </nav>

        <main>
            <section class="SectionName">
                <h2>Songs Report</h2>
            </section>

            <section class="Forms">
                <form>
                    <label for="djs">Choose a DJ:</label>
                    <select id="SelectedDJ" name="djs">
                        <option value="DJ Snake" selected>DJ Snake</option>
                        <option value="J Balvin">J Balvin</option>
                        <option value="Calvin Harris">Calvin Harris</option>
                        <option value="David Guetta">David Guetta</option>
                        <option value="Farruko">Farruko</option>
                        <option value="Bad Bunny">Bad Bunny</option>
                        <option value="Karol G">Karol G</option>
                        <option value="Nicky Jam">Nicky Jam</option>
                        <option value="Ozuna">Ozuna</option>
                        <option value="Maluma">Maluma</option>
                    </select>
                    <button type="submit" id="SubmitSong">Submit</button>
                </form>
            </section>

            <!-- Producer's Playlist section (generated by JavaScript) -->
            <section class="Playlist_Producer">
                <div class="titlePlaylist">Producer's Playlist</div>
                <div class="Playlistlist" id="producerPlaylist">
                    <!-- The playlist will be injected by JavaScript -->
                </div>
            </section>

            <section class="Playlist_DJs">
                <div class="titlePlaylist">DJs Playlist</div>
                <div class="Playlistlist" id="djPlaylist">
                    <ol>
                        <!-- Playlist will be populated by JavaScript -->
                    </ol>
                </div>
            </section>

            <section class="Playlist_Both">
                <div class="titlePlaylist">Songs in both playlists</div>
                <div class="Playlistlist">
                    <ol id="commonSongsList">
                        <!-- Common songs will be listed here -->
                    </ol>
                </div>
            </section>

            <section class="CurrentSong">
                <div class="song-info">
                    <div class="controls">
                        <button>&lt;&lt;</button>
                        <button id ="play" onclick="alert('Music paused')" >||</button> <!-- Play/Pause button -->
                        <button>&gt;&gt;</button>
                    </div>
                    <div class="SongTitle">
                        <p>Dákiti - Bad Bunny & Jhay Cortez</p>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress"></div>
                </div>
            </section>
        </main>
    </div>

    <footer>
        <ul>
            <li><a href="#">Contact Us</a></li>
            <li><a href="#">Privacy Policy</a></li>
            <li><a href="#">Terms of Service</a></li>
        </ul>
    </footer>

    <script src="js.js"></script>
</body>

</html>
